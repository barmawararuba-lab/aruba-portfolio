<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="csGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#211B20"/>
      <stop offset="100%" stop-color="#30282A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#csGrad)"/>
  
  <!-- Subtle UI Frame -->
  <rect x="40" y="40" width="720" height="420" rx="12" fill="#2A2226" stroke="#722F45" stroke-width="1.5"/>
  
  <!-- Browser Header -->
  <rect x="40" y="40" width="720" height="45" rx="12" fill="#211B20"/>
  <circle cx="68" cy="62" r="6" fill="#722F45"/>
  <circle cx="88" cy="62" r="6" fill="#C49A80"/>
  <circle cx="108" cy="62" r="6" fill="#E9DFD5"/>
  <rect x="140" y="52" width="300" height="20" rx="4" fill="#30282A"/>
  <text x="155" y="66" font-family="'DM Sans', sans-serif" font-size="11" fill="#C49A80">campussync.college.edu/events</text>
  
  <!-- Dashboard UI Elements -->
  <!-- Sidebar -->
  <rect x="60" y="105" width="160" height="335" rx="8" fill="#211B20" fill-opacity="0.7"/>
  <text x="80" y="135" font-family="'DM Sans', sans-serif" font-weight="700" font-size="14" fill="#F8F3EA">CampusSync</text>
  <rect x="75" y="155" width="130" height="28" rx="6" fill="#722F45"/>
  <text x="90" y="173" font-family="'DM Sans', sans-serif" font-size="12" fill="#F8F3EA">Events Hub</text>
  <rect x="75" y="195" width="130" height="28" rx="6" fill="transparent"/>
  <text x="90" y="213" font-family="'DM Sans', sans-serif" font-size="12" fill="#C49A80">My RSVPs</text>
  <rect x="75" y="235" width="130" height="28" rx="6" fill="transparent"/>
  <text x="90" y="253" font-family="'DM Sans', sans-serif" font-size="12" fill="#C49A80">Club Leads</text>
  
  <!-- Main Panel -->
  <rect x="240" y="105" width="500" height="335" rx="8" fill="#1C171B"/>
  <text x="265" y="145" font-family="'Playfair Display', serif" font-weight="700" font-size="22" fill="#F8F3EA">Upcoming Technical Sprints</text>
  <text x="265" y="168" font-family="'DM Sans', sans-serif" font-size="12" fill="#C49A80">Live sync across 6 campus engineering clubs</text>
  
  <!-- Event Card 1 -->
  <rect x="265" y="190" width="450" height="68" rx="8" fill="#2A2226" stroke="#722F45" stroke-width="1"/>
  <text x="285" y="220" font-family="'DM Sans', sans-serif" font-weight="700" font-size="14" fill="#F8F3EA">Distributed Systems &amp; Go Workshop</text>
  <text x="285" y="240" font-family="'DM Sans', sans-serif" font-size="11" fill="#C49A80">Coding Club • Lab 4B • Capacity: 48/50 filled</text>
  <rect x="620" y="208" width="80" height="30" rx="6" fill="#722F45"/>
  <text x="660" y="227" font-family="'DM Sans', sans-serif" font-weight="700" font-size="11" fill="#F8F3EA" text-anchor="middle">RSVP Live</text>

  <!-- Event Card 2 -->
  <rect x="265" y="270" width="450" height="68" rx="8" fill="#211B20" stroke="#30282A" stroke-width="1"/>
  <text x="285" y="300" font-family="'DM Sans', sans-serif" font-weight="700" font-size="14" fill="#F8F3EA">React 19 &amp; Next Gen Frontend Architecture</text>
  <text x="285" y="320" font-family="'DM Sans', sans-serif" font-size="11" fill="#C49A80">Web Dev Division • Virtual Stream</text>
  <rect x="620" y="288" width="80" height="30" rx="6" fill="#30282A" stroke="#722F45" stroke-width="1"/>
  <text x="660" y="307" font-family="'DM Sans', sans-serif" font-weight="700" font-size="11" fill="#C49A80" text-anchor="middle">Registered</text>

  <!-- Event Card 3 -->
  <rect x="265" y="350" width="450" height="68" rx="8" fill="#211B20" stroke="#30282A" stroke-width="1"/>
  <text x="285" y="380" font-family="'DM Sans', sans-serif" font-weight="700" font-size="14" fill="#F8F3EA">Collegiate 36-Hour Hackathon Registration</text>
  <text x="285" y="400" font-family="'DM Sans', sans-serif" font-size="11" fill="#C49A80">Auditorium Hall • 120 slots open</text>
