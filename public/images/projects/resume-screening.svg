  <text x="375" y="196" font-family="'DM Sans', sans-serif" font-weight="700" font-size="13" fill="#F8F3EA">Candidate ID: CND-8421</text>
  <text x="375" y="213" font-family="'DM Sans', sans-serif" font-size="11" fill="#C49A80">Score: 96/100 • Python, Scikit-Learn, React</text>
  <rect x="630" y="188" width="70" height="26" rx="4" fill="#722F45"/>
