  <rect x="125" y="228" width="100" height="22" rx="4" fill="#722F45"/>
  <text x="175" y="243" font-family="'DM Sans', sans-serif" font-weight="700" font-size="10" fill="#F8F3EA" text-anchor="middle">Classify Model</text>

  <!-- Category prediction card -->
  <rect x="80" y="275" width="190" height="145" rx="8" fill="#261E23" stroke="#722F45" stroke-width="0.8"/>
  <text x="95" y="300" font-family="'DM Sans', sans-serif" font-weight="700" font-size="12" fill="#F8F3EA">Prediction: ML Engineer</text>
  <text x="95" y="320" font-family="'DM Sans', sans-serif" font-size="10" fill="#C49A80">Match Confidence: 94.2%</text>
  
  <rect x="95" y="335" width="160" height="6" rx="3" fill="#1C161A"/>
  <rect x="95" y="335" width="150" height="6" rx="3" fill="#722F45"/>

  <text x="95" y="365" font-family="'DM Sans', sans-serif" font-size="10" fill="#E9DFD5">Key Skills: Python, PyTorch</text>
  <text x="95" y="385" font-family="'DM Sans', sans-serif" font-size="10" fill="#E9DFD5">Experience: 2+ Years Target</text>
  <text x="95" y="405" font-family="'DM Sans', sans-serif" font-size="10" fill="#10B981">✓ Verification: Passed</text>

  <!-- Right Column: Candidate Ranking Table -->
