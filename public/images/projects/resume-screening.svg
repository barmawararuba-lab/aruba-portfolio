  <text x="375" y="258" font-family="'DM Sans', sans-serif" font-weight="700" font-size="13" fill="#F8F3EA">Candidate ID: CND-7109</text>
  <text x="375" y="275" font-family="'DM Sans', sans-serif" font-size="11" fill="#C49A80">Score: 89/100 • Data Science, SQL, Pandas</text>
  <rect x="630" y="250" width="70" height="26" rx="4" fill="#30282A" stroke="#722F45" stroke-width="1"/>
  <text x="665" y="267" font-family="'DM Sans', sans-serif" font-weight="700" font-size="11" fill="#E9DFD5" text-anchor="middle">Review</text>

  <!-- Candidate 3 -->
  <rect x="325" y="299" width="390" height="52" rx="6" fill="#231A20" stroke="#3A2D35" stroke-width="1"/>
  <circle cx="350" cy="325" r="14" fill="#30282A"/>
  <text x="350" y="330" font-family="'DM Sans', sans-serif" font-weight="700" font-size="12" fill="#E9DFD5" text-anchor="middle">#3</text>
  <text x="375" y="320" font-family="'DM Sans', sans-serif" font-weight="700" font-size="13" fill="#F8F3EA">Candidate ID: CND-5540</text>
  <text x="375" y="337" font-family="'DM Sans', sans-serif" font-size="11" fill="#C49A80">Score: 84/100 • Machine Learning, NLP</text>
  <rect x="630" y="312" width="70" height="26" rx="4" fill="#30282A" stroke="#722F45" stroke-width="1"/>
  <text x="665" y="329" font-family="'DM Sans', sans-serif" font-weight="700" font-size="11" fill="#E9DFD5" text-anchor="middle">Review</text>

  <!-- Candidate 4 -->
  <rect x="325" y="361" width="390" height="52" rx="6" fill="#231A20" stroke="#3A2D35" stroke-width="1"/>
  <circle cx="350" cy="387" r="14" fill="#30282A"/>
  <text x="350" y="392" font-family="'DM Sans', sans-serif" font-weight="700" font-size="12" fill="#E9DFD5" text-anchor="middle">#4</text>
  <text x="375" y="382" font-family="'DM Sans', sans-serif" font-weight="700" font-size="13" fill="#F8F3EA">Candidate ID: CND-3991</text>
  <text x="375" y="399" font-family="'DM Sans', sans-serif" font-size="11" fill="#C49A80">Score: 78/100 • Full Stack, TypeScript, Node</text>
