<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="rsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#211B20"/>
      <stop offset="60%" stop-color="#30282A"/>
      <stop offset="100%" stop-color="#722F45"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#rsBg)"/>
  
  <!-- Outer Window Frame -->
  <rect x="40" y="35" width="720" height="430" rx="14" fill="#261E23" stroke="#722F45" stroke-width="1.5"/>
  
  <!-- Browser Header -->
  <rect x="40" y="35" width="720" height="48" rx="14" fill="#1C161A"/>
  <circle cx="68" cy="59" r="6" fill="#722F45"/>
  <circle cx="88" cy="59" r="6" fill="#C49A80"/>
  <circle cx="108" cy="59" r="6" fill="#E9DFD5"/>
  <rect x="140" y="49" width="340" height="20" rx="4" fill="#2E2429"/>
  <text x="155" y="63" font-family="'DM Sans', sans-serif" font-size="11" fill="#C49A80">ai-resume-screener.internal/dashboard</text>

  <!-- Left Column: Resume Upload & Prediction Score -->
  <rect x="65" y="105" width="220" height="335" rx="10" fill="#1B1619" stroke="#722F45" stroke-width="0.8"/>
  <text x="85" y="135" font-family="'DM Sans', sans-serif" font-weight="700" font-size="14" fill="#F8F3EA">Candidate Ingest</text>
  
