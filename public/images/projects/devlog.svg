  <!-- Right Column: Code Editor & Markdown details -->
  <rect x="300" y="115" width="440" height="320" rx="8" fill="#151114" stroke="#30282A" stroke-width="1"/>
  <text x="325" y="145" font-family="'Playfair Display', serif" font-weight="700" font-size="18" fill="#F8F3EA">useDebounce Hook Implementation</text>
  
  <!-- Code block -->
  <rect x="325" y="165" width="390" height="200" rx="6" fill="#1A1518" stroke="#722F45" stroke-width="0.8"/>
  <text x="340" y="195" font-family="monospace" font-size="12" fill="#C49A80">import { useState, useEffect } from 'react';</text>
  <text x="340" y="225" font-family="monospace" font-size="12" fill="#E9DFD5">export function useDebounce(value, delay) {</text>
  <text x="360" y="255" font-family="monospace" font-size="12" fill="#F8F3EA">  const [debounced, setDebounced] = useState(value);</text>
  <text x="360" y="285" font-family="monospace" font-size="12" fill="#C49A80">  useEffect(() => {</text>
  <text x="380" y="315" font-family="monospace" font-size="12" fill="#722F45">    const handler = setTimeout(() => setDebounced(value), delay);</text>
  <text x="380" y="340" font-family="monospace" font-size="12" fill="#C49A80">    return () => clearTimeout(handler);</text>
  <text x="360" y="360" font-family="monospace" font-size="12" fill="#C49A80">  }, [value, delay]);</text>
  
  <rect x="620" y="380" width="95" height="26" rx="4" fill="#722F45"/>
  <text x="667" y="397" font-family="'DM Sans', sans-serif" font-weight="700" font-size="11" fill="#F8F3EA" text-anchor="middle">Copy Code</text>
