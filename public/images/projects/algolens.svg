<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="alGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#211B20"/>
      <stop offset="100%" stop-color="#30282A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#alGrad)"/>
  
  <rect x="40" y="40" width="720" height="420" rx="12" fill="#251E23" stroke="#722F45" stroke-width="1.2"/>
  
  <!-- Header with algorithm selector & metrics -->
  <rect x="40" y="40" width="720" height="60" rx="12" fill="#1C161A"/>
  <text x="70" y="76" font-family="'Playfair Display', serif" font-weight="700" font-size="20" fill="#F8F3EA">AlgoLens // QuickSort</text>
  
  <rect x="290" y="55" width="120" height="30" rx="6" fill="#722F45"/>
  <text x="350" y="74" font-family="'DM Sans', sans-serif" font-weight="700" font-size="11" fill="#F8F3EA" text-anchor="middle">Step: 14 / 32</text>

  <rect x="425" y="55" width="130" height="30" rx="6" fill="#2B2126" stroke="#C49A80" stroke-width="1"/>
  <text x="490" y="74" font-family="'DM Sans', sans-serif" font-size="11" fill="#C49A80" text-anchor="middle">Time: O(N log N)</text>

  <rect x="570" y="55" width="160" height="30" rx="6" fill="#2B2126" stroke="#722F45" stroke-width="1"/>
  <text x="650" y="74" font-family="'DM Sans', sans-serif" font-size="11" fill="#E9DFD5" text-anchor="middle">Comparisons: 28</text>

  <!-- Sorting Bar Visualizer Canvas Area -->
  <rect x="65" y="125" width="670" height="250" rx="8" fill="#171216"/>
  
  <!-- Visual Bars -->
  <!-- Bar 1 (sorted) -->
  <rect x="100" y="310" width="28" height="50" rx="4" fill="#C49A80"/>
  <text x="114" y="372" font-family="'DM Sans', sans-serif" font-size="10" fill="#E9DFD5" text-anchor="middle">12</text>

  <!-- Bar 2 (sorted) -->
  <rect x="140" y="270" width="28" height="90" rx="4" fill="#C49A80"/>
  <text x="154" y="372" font-family="'DM Sans', sans-serif" font-size="10" fill="#E9DFD5" text-anchor="middle">24</text>

  <!-- Bar 3 (active pointer) -->
  <rect x="180" y="230" width="28" height="130" rx="4" fill="#722F45" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="194" y="372" font-family="'DM Sans', sans-serif" font-size="10" fill="#F8F3EA" text-anchor="middle">38</text>

  <!-- Bar 4 (comparing) -->
  <rect x="220" y="180" width="28" height="180" rx="4" fill="#F8F3EA"/>
  <text x="234" y="372" font-family="'DM Sans', sans-serif" font-size="10" fill="#722F45" text-anchor="middle">54</text>

  <!-- Bar 5 -->
  <rect x="260" y="210" width="28" height="150" rx="4" fill="#3A2E35"/>
  <text x="274" y="372" font-family="'DM Sans', sans-serif" font-size="10" fill="#C49A80" text-anchor="middle">42</text>

  <!-- Bar 6 (Pivot) -->
  <rect x="300" y="150" width="28" height="210" rx="4" fill="#722F45"/>
  <text x="314" y="372" font-family="'DM Sans', sans-serif" font-size="10" fill="#F8F3EA" text-anchor="middle">68</text>

  <!-- Bar 7 -->
  <rect x="340" y="290" width="28" height="70" rx="4" fill="#3A2E35"/>
  <text x="354" y="372" font-family="'DM Sans', sans-serif" font-size="10" fill="#C49A80" text-anchor="middle">18</text>

  <!-- Bar 8 -->
  <rect x="380" y="250" width="28" height="110" rx="4" fill="#3A2E35"/>
  <text x="394" y="372" font-family="'DM Sans', sans-serif" font-size="10" fill="#C49A80" text-anchor="middle">31</text>

  <!-- Bar 9 -->
  <rect x="420" y="160" width="28" height="200" rx="4" fill="#3A2E35"/>
  <text x="434" y="372" font-family="'DM Sans', sans-serif" font-size="10" fill="#C49A80" text-anchor="middle">62</text>

  <!-- Bar 10 -->
  <rect x="460" y="140" width="28" height="220" rx="4" fill="#3A2E35"/>
  <text x="474" y="372" font-family="'DM Sans', sans-serif" font-size="10" fill="#C49A80" text-anchor="middle">75</text>

  <!-- Bar 11 -->
  <rect x="500" y="200" width="28" height="160" rx="4" fill="#3A2E35"/>
  <text x="514" y="372" font-family="'DM Sans', sans-serif" font-size="10" fill="#C49A80" text-anchor="middle">49</text>

  <!-- Bar 12 -->
  <rect x="540" y="120" width="28" height="240" rx="4" fill="#3A2E35"/>
  <text x="554" y="372" font-family="'DM Sans', sans-serif" font-size="10" fill="#C49A80" text-anchor="middle">88</text>

  <!-- Bar 13 -->
  <rect x="580" y="190" width="28" height="170" rx="4" fill="#3A2E35"/>
  <text x="594" y="372" font-family="'DM Sans', sans-serif" font-size="10" fill="#C49A80" text-anchor="middle">45</text>

  <!-- Bar 14 -->
  <rect x="620" y="240" width="28" height="120" rx="4" fill="#3A2E35"/>
  <text x="634" y="372" font-family="'DM Sans', sans-serif" font-size="10" fill="#C49A80" text-anchor="middle">33</text>

  <!-- Bar 15 -->
  <rect x="660" y="110" width="28" height="250" rx="4" fill="#3A2E35"/>
  <text x="674" y="372" font-family="'DM Sans', sans-serif" font-size="10" fill="#C49A80" text-anchor="middle">95</text>

  <!-- Bottom Playback controls -->
  <rect x="65" y="390" width="670" height="50" rx="8" fill="#1C161A"/>
  <rect x="85" y="400" width="90" height="30" rx="6" fill="#722F45"/>
  <text x="130" y="419" font-family="'DM Sans', sans-serif" font-weight="700" font-size="12" fill="#F8F3EA" text-anchor="middle">▶ Play</text>
  <rect x="185" y="400" width="90" height="30" rx="6" fill="#2E2429"/>
  <text x="230" y="419" font-family="'DM Sans', sans-serif" font-size="12" fill="#E9DFD5" text-anchor="middle">⏮ Step Back</text>
  <rect x="285" y="400" width="90" height="30" rx="6" fill="#2E2429"/>
  <text x="330" y="419" font-family="'DM Sans', sans-serif" font-size="12" fill="#E9DFD5" text-anchor="middle">⏭ Step Fwd</text>
  <rect x="385" y="400" width="80" height="30" rx="6" fill="#2E2429"/>
  <text x="425" y="419" font-family="'DM Sans', sans-serif" font-size="12" fill="#E9DFD5" text-anchor="middle">↺ Reset</text>
  <text x="500" y="420" font-family="'DM Sans', sans-serif" font-size="12" fill="#C49A80">Speed: 1.5x</text>
</svg>
