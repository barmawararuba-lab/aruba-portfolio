<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30282A"/>
      <stop offset="50%" stop-color="#211B20"/>
      <stop offset="100%" stop-color="#722F45"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E9DFD5"/>
      <stop offset="100%" stop-color="#C49A80"/>
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#722F45"/>
      <stop offset="100%" stop-color="#211B20"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="750" fill="url(#bgGrad)"/>
  
  <!-- Architectural grid lines in background -->
  <line x1="100" y1="0" x2="100" y2="750" stroke="#722F45" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="500" y1="0" x2="500" y2="750" stroke="#722F45" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="0" y1="200" x2="600" y2="200" stroke="#722F45" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="0" y1="550" x2="600" y2="550" stroke="#722F45" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Halo / Lighting ring -->
  <circle cx="300" cy="310" r="190" fill="#722F45" fill-opacity="0.25"/>
  <circle cx="300" cy="310" r="160" fill="none" stroke="#C49A80" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="4 8"/>

  <!-- Torso & Shoulders -->
  <path d="M 160 620 C 180 480, 240 440, 300 440 C 360 440, 420 480, 440 620 L 460 750 L 140 750 Z" fill="url(#coatGrad)"/>
  
  <!-- Collar / Shirt -->
  <polygon points="265,440 300,520 335,440 315,440 300,470 285,440" fill="#F8F3EA"/>

  <!-- Neck -->
  <rect x="270" y="340" width="60" height="110" rx="8" fill="url(#skinGrad)"/>

  <!-- Head / Face Silhouette -->
  <ellipse cx="300" cy="270" rx="90" ry="110" fill="url(#skinGrad)"/>
  
  <!-- Modern Hair silhouette -->
  <path d="M 200 240 C 200 170, 240 140, 300 140 C 360 140, 400 170, 400 240 C 370 220, 340 220, 300 225 C 260 220, 230 225, 200 240 Z" fill="#211B20"/>
  <path d="M 210 250 C 205 200, 250 170, 300 165 C 360 165, 395 190, 390 250 C 370 230, 340 230, 300 232 C 260 230, 230 235, 210 250 Z" fill="#30282A"/>

  <!-- Minimalist Glasses / Eyewear -->
  <rect x="235" y="250" width="50" height="35" rx="10" fill="none" stroke="#211B20" stroke-width="3.5"/>
  <rect x="315" y="250" width="50" height="35" rx="10" fill="none" stroke="#211B20" stroke-width="3.5"/>
  <line x1="285" y1="265" x2="315" y2="265" stroke="#211B20" stroke-width="3"/>
  <line x1="210" y1="265" x2="235" y2="265" stroke="#211B20" stroke-width="2.5"/>
  <line x1="365" y1="265" x2="390" y2="265" stroke="#211B20" stroke-width="2.5"/>

  <!-- Subtle Features -->
  <path d="M 296 280 L 293 305 L 305 305" fill="none" stroke="#722F45" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 285 330 Q 300 338 315 330" fill="none" stroke="#722F45" stroke-width="3" stroke-linecap="round"/>

  <!-- Editorial typography watermark -->
  <text x="300" y="700" font-family="'Playfair Display', serif" font-size="16" font-style="italic" fill="#F8F3EA" fill-opacity="0.8" text-anchor="middle" letter-spacing="3">ARUBA BARMAWAR • CSE (DATA SCIENCE)</text>
  <text x="300" y="725" font-family="'DM Sans', sans-serif" font-size="11" font-weight="500" fill="#C49A80" text-anchor="middle" letter-spacing="6">AITM BHATKAL • 2ND YEAR</text>
</svg>
